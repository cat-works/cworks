[package]
name = "cworks"
description = "CWorks artifact crate: JS <-> Rust boundary (emscripten cdylib)"
version = "0.1.0"
edition = "2024"

[dependencies]
kernel = { path = "../kernel" }
cworks-lua = { path = "../lua" }
log = "0.4.17"
serde_json = "1"
ghs_demangle = { git = "https://github.com/syoch/ghs_demangle" }
mlua = { version = "0.12", features = ["lua55", "vendored"] }
