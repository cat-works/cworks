[package]
name = "cworks"
description = "CWorks unified WASM module (Lua VM + kernel)"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
kernel = { path = "../kernel" }
mlua = { version = "0.10.5", features = ["lua54", "vendored"] }
log = "0.4.17"
env_logger = "0.10.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ghs_demangle = { git = "https://github.com/syoch/ghs_demangle" }
